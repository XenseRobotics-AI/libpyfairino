[build-system]
requires = [
  "scikit-build-core==0.11.6",
  "pybind11==3.0.1",
  "numpy==2.2.4",
  # Match the LeRobot native runtime in both isolated builds and installations.
  "pin==4.1.0",
  "cmeel-boost==1.90.0",
  "cmeel-urdfdom[build]==6.0.0",
  "cmeel-tinyxml2==11.0.0",
  "eiquadprog==1.3.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "fairino-ik"
version = "0.1.1"
description = "Dual-arm inverse kinematics and Qt visualization for the Fairino wheel-legged robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.4",
  "pin==4.1.0",
  "cmeel-boost==1.90.0",
  "cmeel-urdfdom==6.0.0",
  "cmeel-tinyxml2==11.0.0",
  "eiquadprog==1.3.2",
  "PySide6>=6.6,<7",
  "meshcat>=0.3.2",
  "pytest>=7",
]

[project.scripts]
fairino-ik = "fairino_ik.cli:main"
fairino-ik-qt = "fairino_ik.qt:main"

[tool.scikit-build]
wheel.packages = ["src/fairino_ik"]
cmake.build-type = "Release"
build.tool-args = ["-j1"]
sdist.exclude = ["build", "dist", ".git", "*.excalidraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
