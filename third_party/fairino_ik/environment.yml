name: fairinoik
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.2.4
  - pyside6>=6.6,<7
  - pip
  - pip:
      - pin==4.1.0
      - cmeel-boost==1.90.0
      - cmeel-urdfdom[build]==6.0.0
      - cmeel-tinyxml2==11.0.0
      - eiquadprog==1.3.2
      - pybind11==3.0.1
      - meshcat>=0.3.2
      - pytest>=7
      - -e .

variables:
  PYTHONPATH: ""
  LD_LIBRARY_PATH: ""
  AMENT_PREFIX_PATH: ""
  PYTHONNOUSERSITE: "1"
